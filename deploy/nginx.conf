# TLS termination in front of the API.
#
# Cloudflare is configured as Full (strict), so it opens a TLS connection to
# this host and verifies the certificate. The certificate is a Cloudflare
# Origin Certificate: valid for 15 years, trusted by Cloudflare and by nothing
# else. A browser reaching this IP directly will refuse it, which is correct —
# nobody should be reaching it directly.

# Real client IP.
#
# This matters more than it looks. The API rate-limits per IP and Express is
# configured with `trust proxy` 1, meaning it trusts exactly one hop. Without
# the line below every request would arrive carrying Cloudflare's address, all
# users would share one rate-limit bucket, and a handful of active people would
# lock out everyone else.
#
# Cloudflare puts the true client address in CF-Connecting-IP. Passing that as
# the single X-Forwarded-For entry keeps the chain one hop long, which is what
# `trust proxy` 1 already expects — so no application change is needed.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;          # direct request, or a health probe
}

# Plain HTTP: redirect, and answer ACME challenges if you ever add them.
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # The API accepts 10 MB JSON bodies and 5 MB image uploads for drug
    # detection. nginx defaults to 1 MB and would reject those with a 413
    # before the application ever sees them.
    client_max_body_size 10m;

    # Health checks bypass the access log, or the log is mostly Cloudflare
    # probing an endpoint nobody reads.
    location = /api/v1/health {
        access_log off;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto https;

        # Auth requests carry X-Auth-Transport: cookie, and the backend checks
        # the browser's Origin against its allowlist. Both must survive the
        # hop, and Set-Cookie must come back untouched.
        proxy_set_header  Origin $http_origin;
        proxy_set_header  Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # A report download streams a PDF; the default 60s is enough today but
        # leaves no margin on a single-core box under load.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # PDFs are already compressed and streamed. Buffering them would hold
        # a whole health record in nginx's memory on a machine that has none
        # to spare.
        proxy_buffering off;
    }
}
